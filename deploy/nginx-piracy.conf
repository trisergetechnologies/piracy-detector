# Subdomain reverse proxy — sits alongside your existing Nginx sites.
# Replace piracy.YOURDOMAIN.com before enabling.
#
# sudo cp deploy/nginx-piracy.conf /etc/nginx/sites-available/piracy-detector
# sudo ln -sf /etc/nginx/sites-available/piracy-detector /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d piracy.YOURDOMAIN.com

server {
    listen 80;
    listen [::]:80;
    server_name piracy.YOURDOMAIN.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # Direct API access (optional; dashboard also rewrites /api → Flask)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
